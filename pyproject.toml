[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.4.0"
description = "Web-only LLM Wiki + Zettelkasten on PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "psycopg2-binary>=2.9.0",
    "email-validator>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    # 1.x replaced the get_transcript classmethod with an instance .fetch(); the code uses
    # the 1.x API, so do not relax this floor.
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.1.0",
    "pypdf>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    # ONNX-based embeddings. Chosen over sentence-transformers because that pulls PyTorch
    # (~800MB) into an image that only ever runs inference on 384-dimension vectors.
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
# Only needed to run the MCP server locally; the container that serves the wiki never
# imports it, so it stays out of the image.
mcp = [
    "mcp>=2.0.0",
]
# Local speech-to-text, for videos YouTube will not serve captions for. Only ever used by the
# CLI on your own machine — the container has no reason to carry a transcription model.
stt = [
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
wiki = "wiki_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["wiki_api*", "wiki_core*", "wiki_mcp*", "wiki_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's whole dependency-injection idiom is a call in a default argument.
    "B008",
    # Ingest deliberately catches broad exceptions: a single bad source must not take down
    # a crawl or a background worker.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
