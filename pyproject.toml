[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.4.0"
description = "Web-only LLM Wiki + Zettelkasten on PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "psycopg2-binary>=2.9.0",
    "email-validator>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    # 1.x replaced the get_transcript classmethod with an instance .fetch(); the code uses
    # the 1.x API, so do not relax this floor.
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.1.0",
    "pypdf>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["wiki_api*", "wiki_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's whole dependency-injection idiom is a call in a default argument.
    "B008",
    # Ingest deliberately catches broad exceptions: a single bad source must not take down
    # a crawl or a background worker.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
