name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Build frontend
        working-directory: apps/web
        run: npm ci && npm run build

      - name: Copy static for tests
        run: cp -r apps/web/dist static

      # SQLite run: the fallback search path plus everything dialect-independent.
      - name: Run tests (sqlite)
        env:
          DATABASE_URL: sqlite:////tmp/wiki_ci.db
          JWT_SECRET: test-secret
          TEST_DATABASE_URL_PG: postgresql://wiki:wiki@localhost:5432/wiki
        run: pytest tests/ -v

      # Postgres run: exercises the generated tsvector columns, the GIN indexes and the
      # SKIP LOCKED job claim — none of which SQLite can cover.
      - name: Run tests (postgres)
        env:
          DATABASE_URL: postgresql://wiki:wiki@localhost:5432/wiki
          JWT_SECRET: test-secret
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-wiki:test .

      # Boots the real image against a real database — this is what catches seeding and
      # path-resolution bugs that an editable install hides.
      - name: Smoke test the image
        run: |
          docker network create wikinet
          docker run -d --name pg --network wikinet \
            -e POSTGRES_USER=wiki -e POSTGRES_PASSWORD=wiki -e POSTGRES_DB=wiki \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U wiki && break
            sleep 2
          done
          docker run -d --name app --network wikinet -p 8000:8000 \
            -e DATABASE_URL=postgresql://wiki:wiki@pg:5432/wiki \
            -e JWT_SECRET=ci-secret -e ADMIN_PASSWORD=ci-password \
            llm-wiki:test
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health
          echo "--- stats (must not be zero: proves seeding worked in the image) ---"
          STATS=$(curl -sf localhost:8000/api/stats)
          echo "$STATS"
          echo "$STATS" | grep -qv '"total_pages": *0' || (docker logs app && exit 1)
          python -c "
          import json,sys,urllib.request
          d = json.load(urllib.request.urlopen('http://localhost:8000/api/stats'))
          assert d['total_pages'] > 0, f'image seeded no pages: {d}'
          assert d['total_sources'] > 0, f'image seeded no sources: {d}'
          print('seeded', d['total_pages'], 'pages and', d['total_sources'], 'sources')
          "
