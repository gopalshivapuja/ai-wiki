name: CI

on:
  push:
    branches: [main, 'cursor/**', 'refactor/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check packages tests

      - name: Build frontend
        working-directory: apps/web
        run: npm ci && npm run build

      # The suite asserts the SPA is served, so the build has to be where the app looks.
      - name: Stage the built frontend
        run: cp -r apps/web/dist static

      - name: Run tests
        env:
          DATABASE_URL: postgresql://wiki:wiki@localhost:5432/wiki
          JWT_SECRET: test-secret
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-wiki:test .

      # Boots the real image against a real database. This is what catches seeding and
      # path-resolution bugs that an editable install hides.
      - name: Smoke test the image
        run: |
          docker network create wikinet
          docker run -d --name pg --network wikinet \
            -e POSTGRES_USER=wiki -e POSTGRES_PASSWORD=wiki -e POSTGRES_DB=wiki \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U wiki && break; sleep 2; done

          docker run -d --name app --network wikinet -p 8000:8000 \
            -e DATABASE_URL=postgresql://wiki:wiki@pg:5432/wiki \
            -e JWT_SECRET=ci-secret -e ADMIN_PASSWORD=ci-password \
            ai-wiki:test
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health || (docker logs app && exit 1)

          echo "--- the SPA must actually be served ---"
          curl -sf localhost:8000/ | grep -q 'id="root"' || (docker logs app && exit 1)
          curl -sf localhost:8000/browse | grep -q 'id="root"' || (docker logs app && exit 1)

          echo "--- seeding must have run inside the image ---"
          TOKEN=$(curl -sf -X POST localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-password"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/stats \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["total_notes"] > 0, f"image seeded no notes: {d}"
          assert d["total_sources"] > 0, f"image seeded no sources: {d}"
          print("seeded", d["total_notes"], "notes and", d["total_sources"], "sources")
          '

          echo "--- export must produce a usable archive ---"
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/export -o /tmp/export.zip
          python3 -c '
          import zipfile
          names = zipfile.ZipFile("/tmp/export.zip").namelist()
          assert len(names) > 5, names
          print("export contains", len(names), "files")
          '

          echo "--- SIGTERM must shut down cleanly ---"
          docker stop -t 30 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0" \
            || (docker logs app | tail -20 && exit 1)
