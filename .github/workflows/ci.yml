name: CI

on:
  push:
    branches: [main, 'cursor/**', 'refactor/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check packages tests

      - name: Build frontend
        working-directory: apps/web
        run: npm ci && npm run build

      # The suite asserts the SPA is served, so the build has to be where the app looks.
      - name: Stage the built frontend
        run: cp -r apps/web/dist static

      - name: Run tests
        env:
          DATABASE_URL: postgresql://wiki:wiki@localhost:5432/wiki
          JWT_SECRET: test-secret
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build image
        run: docker build -t ai-wiki:test .

      # Boots the real image against a real database. This is what catches seeding and
      # path-resolution bugs that an editable install hides.
      - name: Smoke test the image
        run: |
          docker network create wikinet
          docker run -d --name pg --network wikinet \
            -e POSTGRES_USER=wiki -e POSTGRES_PASSWORD=wiki -e POSTGRES_DB=wiki \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U wiki && break; sleep 2; done

          docker run -d --name app --network wikinet -p 8000:8000 \
            -e DATABASE_URL=postgresql://wiki:wiki@pg:5432/wiki \
            -e JWT_SECRET=ci-secret -e ADMIN_PASSWORD=ci-password \
            ai-wiki:test
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health || (docker logs app && exit 1)

          echo "--- the SPA must actually be served ---"
          curl -sf localhost:8000/ | grep -q 'id="root"' || (docker logs app && exit 1)
          curl -sf localhost:8000/browse | grep -q 'id="root"' || (docker logs app && exit 1)

          TOKEN=$(curl -sf -X POST localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-password"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          # The image ships no starter content, so the check that matters is the restore
          # path: import an archive and read it back. That is how a real recovery works, and
          # it also gives the browser suite something to navigate.
          echo "--- import must restore content into a fresh image ---"
          (cd tests/fixtures/seed && zip -qr /tmp/restore.zip .)
          curl -sf -H "Authorization: Bearer $TOKEN" -F file=@/tmp/restore.zip \
            localhost:8000/api/jobs/import > /dev/null
          for i in $(seq 1 30); do
            COUNT=$(curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/stats \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["total_notes"])')
            [ "$COUNT" -gt 0 ] && break; sleep 2
          done
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/stats \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["total_notes"] > 0 and d["total_sources"] > 0, f"import restored nothing: {d}"
          print("restored", d["total_notes"], "notes and", d["total_sources"], "sources")
          '

          echo "--- export must produce an archive that actually opens ---"
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/export -o /tmp/export.zip
          python3 -c '
          import zipfile
          zf = zipfile.ZipFile("/tmp/export.zip")
          names = zf.namelist()
          assert len(names) > 2, names
          # namelist() reads the central directory and passes on a corrupt archive — which is
          # exactly how a broken export shipped. Only reading every member catches it.
          assert zf.testzip() is None, "a member failed its CRC or could not be located"
          for n in names:
              zf.read(n)
          print("export contains", len(names), "readable files")
          '

          echo "--- the browser suite must pass against the real image ---"
          npm --prefix apps/web ci
          npx --prefix apps/web playwright install --with-deps chromium
          BASE_URL=http://localhost:8000 \
            WIKI_EMAIL=admin@example.com WIKI_PASSWORD=ci-password \
            npm --prefix apps/web exec -- playwright test --reporter=line \
            || (docker logs app | tail -30 && exit 1)

          echo "--- SIGTERM must shut down cleanly ---"
          docker stop -t 30 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0" \
            || (docker logs app | tail -20 && exit 1)
